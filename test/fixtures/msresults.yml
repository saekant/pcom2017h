<%
  id = 0
  rows = {
    [ "AT5G04140", 1, 3 ] => [ 0, 0.5, 3.0, 1.0, 0, 0.2 ],
    [ "AT5G66570", 2, 3 ] => [ 0, 1.0, 0.4, 0, 0, 0 ],
    [ "sll1499",   3, 9 ] => [ 0.1, 0.9, 0, 0, 0.3, 0 ]
  }
%>
<% rows.each do |(gene, protein_id, material_id), values| %>
<% values.each_with_index do |v, i| %>
<% id += 1 %>
r<%= id %>:
  id: <%= id %>
  gene_id: <%= gene %>
  protein_id: <%= protein_id %>
  material_id: <%= material_id %>
  gel_no: <%= i + 1 %>
  empai: <%= v %>
  empai_rt: <%= (v / values.max * 100).round(1) %>
  peak: <%= v == values.max ? 1 : 0 %>
<% end %>
<% end %>
