# PCoM-DB uses PostgreSQL.
# Production connects through the DATABASE_URL provided by Heroku Postgres.
# This app never creates or migrates the production schema: the tables already exist.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL", "postgres:///pcomdb_development") %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgres:///pcomdb_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
